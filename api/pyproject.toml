[project]
authors = [{name = "dennies", email = "borkiprono@gmail.com"}]
dependencies = []
name = "api"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
api = "uvicorn cswim_api.main:app --reload --host 0.0.0.0 --port 8000 --app-dir src"
test = "pytest"
lint = "ruff check src tests"
seed = { cmd = "python -m seeds.load_all", env = { PYTHONPATH = "src:." } }
refresh-live = { cmd = "python -c 'import asyncio; from cswim_api.live_ingest import run; print(asyncio.run(run()))'", env = { PYTHONPATH = "src" } }
alembic = { cmd = "alembic", env = { PYTHONPATH = "src" } }

[tool.pixi.dependencies]
python = "3.12.*"
fastapi = ">=0.136.1,<0.137"
uvicorn = ">=0.46.0,<0.47"
pydantic = ">=2.13.4,<3"
pydantic-settings = ">=2.14.1,<3"
sqlalchemy = ">=2.0.49,<3"
asyncpg = ">=0.31.0,<0.32"
alembic = ">=1.18.4,<2"
pandas = ">=3.0.3,<4"
pyarrow = ">=24.0.0,<25"
httpx = ">=0.28.1,<0.29"
sgp4 = ">=2.25,<3"
astropy = ">=7.2.0,<8"
spacetrack = ">=1.4.0,<2"
prefect = ">=3.6.24,<4"

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio", "httpx"]
